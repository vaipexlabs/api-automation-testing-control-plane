<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vaipex API automation testing control plane delivery flow</title>
  <desc id="desc">API intent moves through definition, execution, validation, governance, and one quality decision.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#152252" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#175ec8"/></marker>
    <style>.ink{fill:#07164f}.muted{fill:#53617f}.eyebrow{font:700 14px Arial,sans-serif;letter-spacing:1.3px}.title{font:800 34px Arial,sans-serif}.cardtitle{font:700 20px Arial,sans-serif}.body{font:16px Arial,sans-serif}.small{font:14px Arial,sans-serif}.line{stroke:#175ec8;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/><circle cx="1450" cy="45" r="235" fill="#f4efff" opacity=".8"/><circle cx="70" cy="850" r="250" fill="#edf6ff" opacity=".95"/>
  <g transform="translate(583 28)"><path d="M0 0h36l24 43-17 29z" fill="#2877ff"/><path d="M72 0h36L66 72H43z" fill="#6d42e8"/><text x="135" y="55" class="ink" style="font:800 38px Arial,sans-serif;letter-spacing:4px">VAIPEX LABS</text></g>
  <text x="800" y="145" text-anchor="middle" class="title ink">API AUTOMATION TESTING CONTROL PLANE</text><text x="800" y="181" text-anchor="middle" class="body muted">Turn comprehensive API evidence into one explainable quality decision</text>
  <path d="M310 430H350M610 430H650M910 430H950M1210 430H1250" class="line"/>
  <g transform="translate(55 270)" filter="url(#shadow)"><rect width="255" height="320" rx="24" fill="#f7f9ff" stroke="#2877ff" stroke-width="2"/><circle cx="128" cy="60" r="34" fill="#edf6ff" stroke="#2877ff" stroke-width="3"/><path d="M111 49h34v23h-34zM118 42h20" stroke="#2877ff" stroke-width="3" fill="none"/><text x="128" y="115" text-anchor="middle" class="eyebrow ink">DEFINE</text><text x="128" y="155" text-anchor="middle" class="cardtitle ink">Declare API Intent</text><text x="128" y="205" text-anchor="middle" class="body muted">Resources and contracts</text><text x="128" y="235" text-anchor="middle" class="body muted">Roles and ownership</text><text x="128" y="265" text-anchor="middle" class="body muted">Quality policy</text></g>
  <g transform="translate(355 270)" filter="url(#shadow)"><rect width="255" height="320" rx="24" fill="#fff" stroke="#2877ff" stroke-width="2"/><circle cx="128" cy="60" r="34" fill="#edf6ff" stroke="#2877ff" stroke-width="3"/><path d="M108 48h40M108 60h40M108 72h26" stroke="#2877ff" stroke-width="4"/><text x="128" y="115" text-anchor="middle" class="eyebrow ink">EXERCISE</text><text x="128" y="155" text-anchor="middle" class="cardtitle ink">Run Every Method</text><text x="128" y="205" text-anchor="middle" class="body muted">GET • POST • PUT</text><text x="128" y="235" text-anchor="middle" class="body muted">PATCH • DELETE</text><text x="128" y="265" text-anchor="middle" class="body muted">HEAD • OPTIONS</text></g>
  <g transform="translate(655 270)" filter="url(#shadow)"><rect width="255" height="320" rx="24" fill="#f8f5ff" stroke="#6d42e8" stroke-width="2"/><circle cx="128" cy="60" r="34" fill="#f1edff" stroke="#6d42e8" stroke-width="3"/><path d="M108 58l13 13 27-31" stroke="#6d42e8" stroke-width="5" fill="none"/><text x="128" y="115" text-anchor="middle" class="eyebrow ink">VALIDATE</text><text x="128" y="155" text-anchor="middle" class="cardtitle ink">Prove Behavior</text><text x="128" y="205" text-anchor="middle" class="body muted">Status and headers</text><text x="128" y="235" text-anchor="middle" class="body muted">Bodies and schemas</text><text x="128" y="265" text-anchor="middle" class="body muted">Positive and negative</text></g>
  <g transform="translate(955 270)" filter="url(#shadow)"><rect width="255" height="320" rx="24" fill="#f8f5ff" stroke="#6d42e8" stroke-width="2"/><circle cx="128" cy="60" r="34" fill="#f1edff" stroke="#6d42e8" stroke-width="3"/><path d="M128 38l24 10v17c0 16-11 25-24 31-13-6-24-15-24-31V48z" stroke="#6d42e8" stroke-width="3" fill="none"/><text x="128" y="115" text-anchor="middle" class="eyebrow ink">GOVERN</text><text x="128" y="155" text-anchor="middle" class="cardtitle ink">Apply Controls</text><text x="128" y="205" text-anchor="middle" class="body muted">Auth and authorization</text><text x="128" y="235" text-anchor="middle" class="body muted">TRACE • CONNECT denied</text><text x="128" y="265" text-anchor="middle" class="body muted">Resilience and limits</text></g>
  <g transform="translate(1255 270)" filter="url(#shadow)"><rect width="290" height="320" rx="24" fill="#f4fbf8" stroke="#16a085" stroke-width="2"/><circle cx="145" cy="60" r="34" fill="#eaf8f4" stroke="#16a085" stroke-width="3"/><path d="M126 60l13 13 28-32" stroke="#16a085" stroke-width="5" fill="none"/><text x="145" y="115" text-anchor="middle" class="eyebrow ink">DECIDE</text><text x="145" y="155" text-anchor="middle" class="cardtitle ink">Pass or Hold</text><text x="145" y="205" text-anchor="middle" class="body muted">Thresholds evaluated</text><text x="145" y="235" text-anchor="middle" class="body muted">Blockers explained</text><text x="145" y="265" text-anchor="middle" class="body muted">Evidence published</text></g>
  <path d="M1400 590V700Q1400 735 1365 735H225Q190 735 190 700V600" stroke="#6d42e8" stroke-width="3" stroke-dasharray="10 9" fill="none" marker-end="url(#arrow)"/>
  <rect x="535" y="705" width="530" height="58" rx="29" fill="#fff" stroke="#d8cbff" stroke-width="2"/><text x="800" y="741" text-anchor="middle" class="cardtitle" fill="#6d42e8">CONTINUOUS API QUALITY IMPROVEMENT</text>
  <rect x="70" y="810" width="700" height="58" rx="18" fill="#edf6ff" stroke="#a8cfff"/><text x="100" y="845" class="small ink"><tspan font-weight="700">ENGINEERING TEAMS</tspan><tspan> — receive actionable failures and ownership context</tspan></text><rect x="830" y="810" width="700" height="58" rx="18" fill="#f8f5ff" stroke="#d8cbff"/><text x="860" y="845" class="small ink"><tspan font-weight="700">DELIVERY PLATFORM</tspan><tspan> — enforces one transparent API quality contract</tspan></text>
