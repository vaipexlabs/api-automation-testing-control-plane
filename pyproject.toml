[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaipex-api-automation-testing-control-plane"
version = "0.1.0"
description = "A comprehensive, evidence-backed API automation control plane."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Vaipex Labs", email = "vaipex.labs@gmail.com" }]
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pydantic==2.13.4",
    "uvicorn==0.52.3",
]

[project.optional-dependencies]
test = [
    "pip-tools==7.6.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "pytest-xdist==3.8.0",
    "respx==0.23.1",
    "ruff==0.16.3",
    "schemathesis==4.24.3",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "contract: validates the OpenAPI and response-schema contract",
    "functional: validates API resource behavior and HTTP semantics",
    "resilience: validates failure, limit, and concurrency behavior",
    "security: validates authentication, authorization, and method rejection",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
where = ["src"]
